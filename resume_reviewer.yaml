name: Job Hunter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest

      - name: Run linter on resume.py
        run: pylint resume.py --fail-under=7.0

      - name: Run linter on analyzer.py
        run: pylint analyzer.py --fail-under=7.0

      - name: Run linter on databse.py
        run: pylint databse.py --fail-under=7.0

      - name: Run linter on job_scraper.py
        run: pylint job_scraper.py --fail-under=7.0

      - name: Run linter on llm.py
        run: pylint llm.py --fail-under=7.0

      - name: Run linter on app.py
        run: pylint app.py --fail-under=7.0

      - name: Run resume tests
        run: pytest tests/test_resume.py -v --tb=short

      - name: Run analyzer tests
        run: pytest tests/test_analyzer.py -v --tb=short

      - name: Run database tests
        run: pytest tests/test_db.py -v --tb=short

      - name: Run job scraper tests
        run: pytest tests/test_job_scraper.py -v --tb=short
